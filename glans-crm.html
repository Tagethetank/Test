/* ====================== APP ====================== */

const hasStore = (() => { try { localStorage.setItem("__glanst", "1"); localStorage.removeItem("__glanst"); return true; } catch (e) { return false; } })();
const __mem = {};
function sGet(key) { try { const v = hasStore ? localStorage.getItem(key) : __mem[key]; return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function sSet(key, val) { try { const s = JSON.stringify(val); if (hasStore) localStorage.setItem(key, s); else __mem[key] = s; } catch (e) {} }
function sDel(key) { try { if (hasStore) localStorage.removeItem(key); else delete __mem[key]; } catch (e) {} }

/* ================================================================== */
/*  Huvudkomponent                                                     */
/* ================================================================== */
function GlansCRM() {
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("dash");
  const [emp, setEmp] = useState([]);
  const [cust, setCust] = useState([]);
  const [jobs, setJobs] = useState([]);
  const [settings, setSettings] = useState(SEED().set);
  const [toast, setToast] = useState(null);
  const [modal, setModal] = useState(null); // {type, data}
  const [sessionId, setSessionId] = useState(null);

  // Ladda
  useEffect(() => {
    (async () => {
      const seed = SEED();
      const e = (await sGet(KEYS.emp)) ?? seed.emp;
      const c = (await sGet(KEYS.cust)) ?? seed.cust;
      const j = (await sGet(KEYS.jobs)) ?? seed.jobs;
      const s = (await sGet(KEYS.set)) ?? seed.set;
      setEmp(e); setCust(c); setJobs(j); setSettings(s);
      const sess = await sGet(KEYS.session);
      if (sess && e.some((x) => x.id === sess)) setSessionId(sess);
      if (!hasStore) { /* in-memory only */ }
      else {
        if (!(await sGet(KEYS.emp))) sSet(KEYS.emp, e);
        if (!(await sGet(KEYS.cust))) sSet(KEYS.cust, c);
        if (!(await sGet(KEYS.jobs))) sSet(KEYS.jobs, j);
        if (!(await sGet(KEYS.set))) sSet(KEYS.set, s);
      }
      setLoaded(true);
    })();
  }, []);

  const flash = useCallback((msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); }, []);

  // Persisterande setters
  const saveEmp = (next) => { setEmp(next); sSet(KEYS.emp, next); };
  const saveCust = (next) => { setCust(next); sSet(KEYS.cust, next); };
  const saveJobs = (next) => { setJobs(next); sSet(KEYS.jobs, next); };
  const saveSet = (next) => { setSettings(next); sSet(KEYS.set, next); };

  /* ---------- uppslag ---------- */
  const empById = useMemo(() => Object.fromEntries(emp.map((e) => [e.id, e])), [emp]);
  const custById = useMemo(() => Object.fromEntries(cust.map((c) => [c.id, c])), [cust]);

  /* ---------- ekonomiska beräkningar ---------- */
  const rutOf = (j) => (j.rutEligible ? Math.round((j.price - (j.materialCost || 0)) * 0.5) : 0);
  const customerPays = (j) => j.price - rutOf(j);
  const sellerComm = (j) => Math.round((empById[j.soldById]?.provisionRate || 0) / 100 * j.price);
  const cleanerComm = (j) => Math.round((empById[j.assignedToId]?.tvattRate || 0) / 100 * j.price);
  const totalComp = (j) => sellerComm(j) + cleanerComm(j);

  /* ---------- jobbåtgärder ---------- */
  const upsertJob = (job) => {
    const exists = jobs.some((j) => j.id === job.id);
    saveJobs(exists ? jobs.map((j) => (j.id === job.id ? job : j)) : [job, ...jobs]);
  };
  const deleteJob = (id) => saveJobs(jobs.filter((j) => j.id !== id));

  const finishJob = (job, paymentMethod, sendReceipt) => {
    const updated = {
      ...job, status: "Klar", paid: true, paymentMethod: paymentMethod || job.paymentMethod || "Swish",
      receiptSent: sendReceipt ? true : job.receiptSent,
      receiptSentAt: sendReceipt ? todayISO() : job.receiptSentAt,
      scheduledDate: job.scheduledDate || todayISO(),
    };
    upsertJob(updated);
    const c = custById[job.customerId];
    if (sendReceipt) flash(`Kvitto skickat till ${c?.name || "kund"}${c?.email ? " (" + c.email + ")" : ""}`);
    else flash("Jobb markerat som klart");
    if (sendReceipt) setModal({ type: "receipt", data: updated });
  };

  const currentUser = sessionId ? emp.find((e) => e.id === sessionId) : null;

  const login = (id, pin) => {
    const u = emp.find((e) => e.id === id);
    if (!u || String(u.pin || "1234") !== String(pin)) return false;
    setSessionId(id); sSet(KEYS.session, id); setTab("dash"); return true;
  };
  const logout = () => { setSessionId(null); if (hasStore) try { sDel(KEYS.session); } catch (e) {} };

  const newJobBase = () => ({
    id: uid(), customerId: cust[0]?.id || "", soldById: "", assignedToId: "", soldAt: todayISO(),
    scheduledDate: "", status: "Såld", price: 1500, materialCost: 0, rutEligible: true,
    paymentMethod: "", paid: false, rutStatus: "Ej ansökt", receiptSent: false, receiptSentAt: "", commissionPaid: false, notes: "",
  });
  const openSale = (prefill) => setModal({ type: "job", data: prefill ? { ...newJobBase(), ...prefill } : null });

  if (!loaded) {
    return (
      <div style={st.wrap}><style>{CSS}</style>
        <div className="loading"><Droplets size={28} /><span>Laddar GLANS…</span></div>
      </div>
    );
  }

  const ctx = { emp, cust, jobs, settings, empById, custById, rutOf, customerPays, sellerComm, cleanerComm, totalComp,
    saveEmp, saveCust, saveJobs, saveSet, upsertJob, deleteJob, finishJob, setModal, flash, currentUser, openSale };

  if (!currentUser) {
    return (
      <div style={st.wrap}><style>{CSS}</style>
        <Login employees={emp.filter((e) => e.active)} onLogin={login} company={settings.company} />
        {!hasStore && <div className="warnbar"><AlertTriangle size={14} /> Lokal lagring ej tillgänglig här – data sparas bara under sessionen.</div>}
      </div>
    );
  }

  const isAdmin = !!currentUser.isAdmin;
  const canSell = currentUser.role === "Säljare" || currentUser.role === "Båda" || currentUser.provisionRate > 0;
  const NAV = [
    { id: "dash", label: "Översikt", Icon: LayoutDashboard },
    { id: "jobs", label: "Jobb & Sälj", Icon: Briefcase },
    { id: "cust", label: "Kunder", Icon: Users },
    { id: "team", label: "Team", Icon: UserCog },
    { id: "rut", label: "RUT", Icon: Receipt },
    { id: "set", label: "Inställningar", Icon: Settings },
  ];

  return (
    <div style={st.wrap}>
      <style>{CSS}</style>

      <header className="topbar">
        <div className="brand">
          <div className="logo"><Droplets size={20} /></div>
          <div>
            <div className="brand-name">GLANS</div>
            <div className="brand-sub">{isAdmin ? "Admin · hela företaget" : "Min sida"}</div>
          </div>
        </div>
        <div className="top-right">
          {(isAdmin || canSell) && (
            <button className="btn btn-primary" onClick={() => openSale(isAdmin ? null : { soldById: currentUser.id })}>
              <Plus size={16} /> Nytt sälj
            </button>
          )}
          <div className="user-chip">
            <div className="avatar">{currentUser.name[0]}</div>
            <div><div className="uc-name">{currentUser.name}</div><div className="uc-role">{isAdmin ? "VD" : currentUser.role}</div></div>
          </div>
          <button className="icon-btn logout" title="Logga ut" onClick={logout}><X size={16} /></button>
        </div>
      </header>

      {isAdmin ? (
        <>
          <nav className="nav">
            {NAV.map(({ id, label, Icon }) => (
              <button key={id} className={tab === id ? "nav-on" : ""} onClick={() => setTab(id)}>
                <Icon size={16} /> {label}
              </button>
            ))}
          </nav>
          <main className="main">
            {tab === "dash" && <Dashboard ctx={ctx} setTab={setTab} />}
            {tab === "jobs" && <Jobs ctx={ctx} />}
            {tab === "cust" && <Customers ctx={ctx} />}
            {tab === "team" && <Team ctx={ctx} />}
            {tab === "rut" && <RutPanel ctx={ctx} />}
            {tab === "set" && <SettingsPanel ctx={ctx} />}
          </main>
        </>
      ) : (
        <main className="main"><Portal user={currentUser} ctx={ctx} /></main>
      )}

      {/* Modaler */}
      {modal?.type === "job" && <JobModal ctx={ctx} job={modal.data} close={() => setModal(null)} />}
      {modal?.type === "finish" && <FinishModal ctx={ctx} job={modal.data} close={() => setModal(null)} />}
      {modal?.type === "receipt" && <ReceiptModal ctx={ctx} job={modal.data} close={() => setModal(null)} />}
      {modal?.type === "cust" && <CustomerModal ctx={ctx} c={modal.data} close={() => setModal(null)} />}
      {modal?.type === "emp" && <EmployeeModal ctx={ctx} e={modal.data} close={() => setModal(null)} />}

      {toast && <div className="toast"><BadgeCheck size={16} /> {toast}</div>}
      {!hasStore && <div className="warnbar"><AlertTriangle size={14} /> Lokal lagring ej tillgänglig här – data sparas bara under sessionen.</div>}
    </div>
  );
}

/* ================================================================== */
/*  LOGIN                                                              */
/* ================================================================== */
function Login({ employees, onLogin, company }) {
  const [sel, setSel] = useState(null);
  const [pin, setPin] = useState("");
  const [err, setErr] = useState(false);
  const submit = () => { if (!onLogin(sel.id, pin)) { setErr(true); setPin(""); } };
  return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-logo"><Droplets size={26} /></div>
        <div className="brand-name" style={{ color: "var(--ink)", fontSize: 26 }}>GLANS</div>
        <p className="muted small" style={{ marginTop: 2 }}>{company}</p>

        {!sel ? (
          <>
            <p className="login-q">Vem är du?</p>
            <div className="people-grid">
              {employees.map((e) => (
                <button key={e.id} className="person-card" onClick={() => { setSel(e); setErr(false); }}>
                  <div className="avatar lg">{e.name[0]}</div>
                  <div className="person-name">{e.name}</div>
                  <div className="role-tag">{e.isAdmin ? "VD" : e.role}</div>
                </button>
              ))}
            </div>
          </>
        ) : (
          <div className="pin-pane">
            <div className="avatar xl">{sel.name[0]}</div>
            <p className="login-q">Hej {sel.name}!</p>
            <input className={"pin-input" + (err ? " shake" : "")} type="password" inputMode="numeric"
              value={pin} placeholder="••••" autoFocus
              onChange={(e) => { setPin(e.target.value); setErr(false); }}
              onKeyDown={(e) => e.key === "Enter" && submit()} />
            {err && <div className="pin-err">Fel PIN, försök igen.</div>}
            <div className="pin-row">
              <button className="btn btn-ghost" onClick={() => { setSel(null); setPin(""); setErr(false); }}>Tillbaka</button>
              <button className="btn btn-primary" onClick={submit}>Logga in</button>
            </div>
            <p className="muted small">Demo-PIN: 1234</p>
          </div>
        )}
      </div>
    </div>
  );
}

  const cleanDone = myClean.filter((j) => j.status === "Klar");

              <div key={k.label} className={"card kpi kpi-" + k.accent}><div className="kpi-label">{k.label}</div><div className="kpi-val">{k.val}</div></div>
            ))}

          {canClean && (
            <div className="card">
              <div className="card-head"><h3>Närmast på tur att putsa</h3>{TABS.length > 1 && <button className="link" onClick={() => setPtab("clean")}>Visa alla <ChevronRight size={14} /></button>}</div>
              {toDo.length === 0 ? <Empty text="Inga inbokade jobb just nu." /> :
                <ul className="mini-list">
                  {toDo.sort((a, b) => (a.scheduledDate || "z").localeCompare(b.scheduledDate || "z")).slice(0, 4).map((j) => {
                    const c = custById[j.customerId];
                    return <li key={j.id}><div><div className="ml-name">{c?.name} · {c?.address}</div><div className="ml-sub"><CalendarDays size={12} /> {dfmt(j.scheduledDate) || "tid ej satt"}</div></div>
                      {c?.phone && <a className="ring" href={`tel:${c.phone.replace(/\s/g, "")}`}><Phone size={14} /></a>}</li>;
                  })}
                </ul>}
            </div>
          )}

      )}

      {ptab === "clean" && (
        <>
          <SectionTitle title="Att putsa" sub="Dina hus – adress, tid och vad kunden ska betala på plats." />
          <div className="job-grid">
            {toDo.length === 0 && cleanDone.length === 0 && <Empty text="Du har inga tilldelade jobb." />}
            {[...toDo.sort((a, b) => (a.scheduledDate || "z").localeCompare(b.scheduledDate || "z")), ...cleanDone].map((j) => {
              const c = custById[j.customerId];

              return (
                <div key={j.id} className={"card job-card" + (done ? " faded" : "")}>
                  <div className="job-top">

                    <span className={"badge st-" + j.status}>{j.status}</span>

                  <div className="job-meta">
                    {j.scheduledDate && <span><CalendarDays size={12} /> {dfmt(j.scheduledDate)}</span>}

                  </div>

                  {j.notes && <div className="note">🪟 {j.notes}</div>}

/*  ÖVERSIKT                                                           */

function Dashboard({ ctx, setTab }) {
  const { jobs, cust, custById, empById, rutOf, totalComp } = ctx;
  const done = jobs.filter((j) => j.status === "Klar");

  const omsattning = done.reduce((s, j) => s + j.price, 0);
  const provKvar = done.filter((j) => !j.commissionPaid).reduce((s, j) => s + totalComp(j), 0);
  const rutKvar = done.filter((j) => j.rutStatus === "Ej ansökt").reduce((s, j) => s + rutOf(j), 0);

  const perSeller = useMemo(() => {
    const m = {};
    done.forEach((j) => { const n = empById[j.soldById]?.name || "—"; m[n] = (m[n] || 0) + j.price; });
    return Object.entries(m).map(([name, v]) => ({ name: name.split(" ")[0], v })).sort((a, b) => b.v - a.v);
  }, [done, empById]);

  const upcoming = jobs.filter((j) => j.status === "Bokad" && j.scheduledDate)
    .sort((a, b) => a.scheduledDate.localeCompare(b.scheduledDate)).slice(0, 6);

  // Återkommande som snart är dags
  const dueSoon = useMemo(() => {
    const out = [];
    cust.filter((c) => c.recurringMonths > 0).forEach((c) => {
      const last = jobs.filter((j) => j.customerId === c.id && j.status === "Klar")
        .sort((a, b) => (b.scheduledDate || "").localeCompare(a.scheduledDate || ""))[0];
      if (!last?.scheduledDate) return;
      const next = addMonths(last.scheduledDate, c.recurringMonths);
      const days = Math.round((new Date(next) - new Date()) / 86400000);
      if (days <= 45) out.push({ c, next, days });
    });
    return out.sort((a, b) => a.days - b.days);
  }, [cust, jobs]);

  const KPIS = [
    { label: "Omsättning (klara jobb)", val: kr(omsattning), accent: "ink" },
    { label: "Antal klara jobb", val: done.length, accent: "aqua" },
    { label: "Provision att betala", val: kr(provKvar), accent: "sun" },
    { label: "RUT att ansöka", val: kr(rutKvar), accent: "violet" },
  ];

  return (
    <div className="stack">
      <SectionTitle title="Översikt" sub="Pulsen på företaget – uppdateras i realtid." />
      <div className="kpi-grid">
        {KPIS.map((k) => (
          <div key={k.label} className={"card kpi kpi-" + k.accent}>
            <div className="kpi-label">{k.label}</div>
            <div className="kpi-val">{k.val}</div>
          </div>
        ))}
      </div>

      <div className="two-col">
        <div className="card">
          <div className="card-head"><h3>Sälj per säljare</h3></div>
          {perSeller.length === 0 ? <Empty text="Inga klara jobb ännu." /> : (
            <div className="barchart">
              {(() => { const max = Math.max.apply(null, perSeller.map((d) => d.v).concat([1])); const cols = ["#0fb5a6", "#12403c", "#f5a623", "#7c6cf0"]; return perSeller.map((d, i) => (
                <div className="bar-col" key={d.name}>
                  <div className="bar-v">{kr(d.v)}</div>
                  <div className="bar-track"><div className="bar-fill" style={{ height: (d.v / max * 100) + "%", background: cols[i % 4] }} /></div>
                  <div className="bar-x">{d.name}</div>
                </div>
              )); })()}
            </div>
          )}
        </div>

        <div className="card">
          <div className="card-head"><h3>Kommande bokade jobb</h3>
            <button className="link" onClick={() => setTab("jobs")}>Alla jobb <ChevronRight size={14} /></button></div>
          {upcoming.length === 0 ? <Empty text="Inga bokade jobb." /> : (
            <ul className="mini-list">
              {upcoming.map((j) => {
                const c = custById[j.customerId];
                return (
                  <li key={j.id}>
                    <div>
                      <div className="ml-name">{c?.name}</div>
                      <div className="ml-sub"><CalendarDays size={12} /> {dfmt(j.scheduledDate)} · Tvätt: {empById[j.assignedToId]?.name?.split(" ")[0] || "ej satt"}</div>
                    </div>
                    {c?.phone && <a className="ring" href={`tel:${c.phone.replace(/\s/g, "")}`}><Phone size={14} /> Ring</a>}
                  </li>
                );
              })}
            </ul>
          )}
        </div>
      </div>

      <div className="card">
        <div className="card-head"><h3><Repeat size={16} style={{ verticalAlign: "-3px" }} /> Återkommande kunder – dags snart</h3></div>
        {dueSoon.length === 0 ? <Empty text="Inget återkommande på gång inom 45 dagar." /> : (
          <div className="chips">
            {dueSoon.map(({ c, next, days }) => (
              <div key={c.id} className={"chip " + (days < 0 ? "chip-late" : "")}>
                <strong>{c.name}</strong>
                <span>{days < 0 ? `försenad ${-days} d` : `om ${days} d`} · {dfmt(next)}</span>
                {c.phone && <a className="ring" href={`tel:${c.phone.replace(/\s/g, "")}`}><Phone size={12} /></a>}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/*  TEAM                                                               */
/* ================================================================== */
function Team({ ctx }) {
  const { emp, jobs, sellerComm, cleanerComm, setModal } = ctx;
  const done = jobs.filter((j) => j.status === "Klar");
  const stats = (e) => {
    const sold = done.filter((j) => j.soldById === e.id);
    const cleaned = done.filter((j) => j.assignedToId === e.id);
    const comm = sold.reduce((s, j) => s + sellerComm(j), 0) + cleaned.reduce((s, j) => s + cleanerComm(j), 0);
    const owed = sold.filter((j) => !j.commissionPaid).reduce((s, j) => s + sellerComm(j), 0)
      + cleaned.filter((j) => !j.commissionPaid).reduce((s, j) => s + cleanerComm(j), 0);
    return { sold: sold.length, cleaned: cleaned.length, comm, owed };
  };
  return (
    <div className="stack">
      <SectionTitle title="Team" sub="Roller, provision och ersättning per anställd." />
      <div className="toolbar"><div /><button className="btn btn-primary" onClick={() => setModal({ type: "emp", data: null })}><Plus size={16} /> Lägg till anställd</button></div>
      <div className="job-grid">
        {emp.map((e) => {
          const s = stats(e);
          return (
            <div key={e.id} className="card">
              <div className="job-top">
                <div><div className="job-cust">{e.name}</div><div className="muted">{e.role} · {e.phone}</div></div>
                <button className="icon-btn" onClick={() => setModal({ type: "emp", data: e })}><Pencil size={14} /></button>
              </div>
              <div className="rate-row">
                {e.isAdmin && <span className="tag tag-admin">Admin / VD</span>}
                <span className="tag">Säljprovision {e.provisionRate}%</span>
                <span className="tag">Tvättersättning {e.tvattRate}%</span>
                <span className="tag">PIN {e.pin || "1234"}</span>
              </div>
              <div className="cust-stats">
                <div><span>Sålt</span><strong>{s.sold} jobb</strong></div>
                <div><span>Tvättat</span><strong>{s.cleaned} jobb</strong></div>
                <div><span>Intjänat</span><strong>{kr(s.comm)}</strong></div>
                <div className={s.owed ? "danger" : ""}><span>Kvar att betala</span><strong>{kr(s.owed)}</strong></div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function RutPanel({ ctx }) {
  const { jobs, custById, rutOf, upsertJob, flash } = ctx;
  const done = jobs.filter((j) => j.status === "Klar" && j.rutEligible);
  const groups = RUT_STATES.map((st) => ({ st, items: done.filter((j) => j.rutStatus === st) }));
  const toClaim = groups.find((g) => g.st === "Ej ansökt").items.reduce((s, j) => s + rutOf(j), 0);

  const copyRow = (j) => {
    const c = custById[j.customerId];
    const txt = [c?.name, c?.personnummer, "Fönsterputsning", `Arbetskostnad ${j.price - (j.materialCost || 0)} kr`, `RUT-belopp ${rutOf(j)} kr`].join("\t");
    navigator.clipboard?.writeText(txt); flash("Rad kopierad – klistra in i Skatteverkets formulär.");
  };
  const setRut = (j, status) => upsertJob({ ...j, rutStatus: status });

  return (
    <div className="stack">
      <SectionTitle title="RUT-underlag" sub="Allt du behöver för Skatteverkets 'Begär utbetalning'. Markera när du ansökt och när pengarna kommit." />
      <div className="card info-card">
        <div><div className="kpi-label">Att ansöka om nu</div><div className="kpi-val sun">{kr(toClaim)}</div></div>
        <p className="muted small">RUT = 50&nbsp;% av arbetskostnaden (inkl. moms), max 75&nbsp;000&nbsp;kr/person&amp;år. Fönsterputs räknas i sin helhet som arbete. Personnummer krävs i ansökan.</p>
      </div>

      {groups.map(({ st, items }) => (
        <div key={st} className="card">
          <div className="card-head"><h3>{st} <em className="cnt">{items.length}</em></h3>
            {st !== "Ej ansökt" && <span className="muted small">{kr(items.reduce((s, j) => s + rutOf(j), 0))}</span>}</div>
          {items.length === 0 ? <Empty text="Inga jobb här." /> : (
            <div className="rut-table">
              <div className="rut-head"><span>Kund</span><span>Personnr</span><span>Arbetskostnad</span><span>RUT-belopp</span><span></span></div>
              {items.map((j) => {
                const c = custById[j.customerId];
                return (
                  <div key={j.id} className="rut-row">
                    <span data-l="Kund">{c?.name}</span>
                    <span data-l="Personnr" className="mono">{c?.personnummer || "saknas!"}</span>
                    <span data-l="Arbete">{kr(j.price - (j.materialCost || 0))}</span>
                    <span data-l="RUT"><strong>{kr(rutOf(j))}</strong></span>
                    <span className="rut-actions">
                      <button className="icon-btn" title="Kopiera rad" onClick={() => copyRow(j)}><Copy size={13} /></button>
                      {st === "Ej ansökt" && <button className="btn btn-ghost btn-sm" onClick={() => setRut(j, "Ansökt")}>Markera ansökt</button>}
                      {st === "Ansökt" && <button className="btn btn-ghost btn-sm" onClick={() => setRut(j, "Utbetald")}>Markera utbetald</button>}
                    </span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

/* ================================================================== */
/*  INSTÄLLNINGAR                                                      */
/* ================================================================== */
function SettingsPanel({ ctx }) {
  const { settings, saveSet, flash } = ctx;
  const [f, setF] = useState(settings);
  const ch = (k, v) => setF({ ...f, [k]: v });
  const reset = async () => {
    if (!confirm("Återställ ALL data till exempeldata? Detta går inte att ångra.")) return;
    const seed = SEED();
    await Promise.all([sSet(KEYS.emp, seed.emp), sSet(KEYS.cust, seed.cust), sSet(KEYS.jobs, seed.jobs), sSet(KEYS.set, seed.set)]);
    location.reload();
  };
  return (
    <div className="stack">
      <SectionTitle title="Inställningar" sub="Företagsuppgifter visas på kvittona. RUT-taket används för varningar." />
      <div className="card form-card">
        <div className="form-grid">
          <Field label="Företagsnamn"><input value={f.company} onChange={(e) => ch("company", e.target.value)} /></Field>
          <Field label="Org.nr"><input value={f.orgnr} onChange={(e) => ch("orgnr", e.target.value)} /></Field>
          <Field label="Telefon"><input value={f.phone} onChange={(e) => ch("phone", e.target.value)} /></Field>
          <Field label="E-post"><input value={f.email} onChange={(e) => ch("email", e.target.value)} /></Field>
          <Field label="Adress" full><input value={f.address} onChange={(e) => ch("address", e.target.value)} /></Field>
          <Field label="RUT-tak per person/år (kr)"><input type="number" value={f.rutCap} onChange={(e) => ch("rutCap", +e.target.value)} /></Field>
        </div>
        <div className="row-end"><button className="btn btn-primary" onClick={() => { saveSet(f); flash("Sparat"); }}>Spara</button></div>
      </div>

      <div className="card">
        <div className="card-head"><h3>Automatiska kvittoutskick</h3></div>
        <p className="muted small">När du klickar <strong>Avsluta jobb</strong> genereras kvittot direkt och markeras som skickat. I den här prototypen visas/öppnas kvittot åt dig. För att det ska gå iväg till kunden <strong>helt utan handpåläggning</strong> kopplas en e-post-/SMS-tjänst på (t.ex. en e-postleverantörs API, eller 46elks för svenskt SMS) – då skickas det automatiskt i samma klick.</p>
      </div>

      <div className="card danger-card">
        <div className="card-head"><h3>Dataverktyg</h3></div>
        <p className="muted small">Data sparas {hasStore ? "lokalt och finns kvar mellan besök" : "endast under sessionen i denna miljö"}.</p>
        <button className="btn btn-danger" onClick={reset}><Trash2 size={15} /> Återställ till exempeldata</button>
      </div>
    </div>
  );
}

/* ================================================================== */
/*  MODALER                                                            */
/* ================================================================== */
function Modal({ title, close, children, wide }) {
  return (
    <div className="modal-overlay" onClick={close}>
      <div className={"modal" + (wide ? " modal-wide" : "")} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head"><h2>{title}</h2><button className="icon-btn" onClick={close}><X size={18} /></button></div>
        <div className="modal-body">{children}</div>
      </div>
    </div>
  );
}

function JobModal({ ctx, job, close }) {
  const { cust, emp, jobs, upsertJob, deleteJob, flash } = ctx;
  const editing = job && jobs.some((j) => j.id === job.id);
  const sellers = emp.filter((e) => e.active && (e.role === "Säljare" || e.role === "Båda" || e.provisionRate > 0));
  const cleaners = emp.filter((e) => e.active && (e.role === "Tvättare" || e.role === "Båda" || e.tvattRate > 0));
  const [f, setF] = useState(job || {
    id: uid(), customerId: cust[0]?.id || "", soldById: sellers[0]?.id || "", assignedToId: "",
    soldAt: todayISO(), scheduledDate: "", status: "Såld", price: 1500, materialCost: 0, rutEligible: true,
    paymentMethod: "", paid: false, rutStatus: "Ej ansökt", receiptSent: false, receiptSentAt: "", commissionPaid: false, notes: "",
  });
  const ch = (k, v) => setF({ ...f, [k]: v });
  const save = () => {
    if (!f.customerId) return flash("Välj en kund först.");
    const next = { ...f, status: f.scheduledDate && f.status === "Såld" ? "Bokad" : f.status };
    upsertJob(next); flash(editing ? "Jobb uppdaterat" : "Sälj registrerat"); close();
  };
  const rut = f.rutEligible ? Math.round((f.price - (f.materialCost || 0)) * 0.5) : 0;
  return (
    <Modal title={editing ? "Redigera jobb" : "Nytt sälj"} close={close}>
      <div className="form-grid">
        <Field label="Kund" full>
          <div className="row-gap">
            <select value={f.customerId} onChange={(e) => ch("customerId", e.target.value)}>
              <option value="">– välj kund –</option>
              {cust.map((c) => <option key={c.id} value={c.id}>{c.name}{c.ort ? ` (${c.ort})` : ""}</option>)}
            </select>
            <button className="btn btn-ghost" onClick={() => ctx.setModal({ type: "cust", data: null })}><Plus size={14} /> Ny</button>
          </div>
        </Field>
        <Field label="Såld av (säljare)"><select value={f.soldById} onChange={(e) => ch("soldById", e.target.value)}>
          <option value="">–</option>{sellers.map((e) => <option key={e.id} value={e.id}>{e.name}</option>)}</select></Field>
        <Field label="Tvättas av"><select value={f.assignedToId} onChange={(e) => ch("assignedToId", e.target.value)}>
          <option value="">– ej satt –</option>{cleaners.map((e) => <option key={e.id} value={e.id}>{e.name}</option>)}</select></Field>
        <Field label="Pris inkl. moms (kr)"><input type="number" value={f.price} onChange={(e) => ch("price", +e.target.value)} /></Field>
        <Field label="Materialkostnad (ej RUT, kr)"><input type="number" value={f.materialCost} onChange={(e) => ch("materialCost", +e.target.value)} /></Field>
        <Field label="Bokad tid"><input type="date" value={f.scheduledDate} onChange={(e) => ch("scheduledDate", e.target.value)} /></Field>
        <Field label="Status"><select value={f.status} onChange={(e) => ch("status", e.target.value)}>{STATUSES.map((s) => <option key={s}>{s}</option>)}</select></Field>
        <Field label="Anteckning" full><textarea rows={2} value={f.notes} onChange={(e) => ch("notes", e.target.value)} /></Field>
      </div>
      <div className="calc-strip">
        <div><span>RUT-avdrag</span><strong>−{kr(rut)}</strong></div>
        <div className="hl"><span>Kund betalar på plats</span><strong>{kr(f.price - rut)}</strong></div>
      </div>
      <div className="modal-foot">
        {editing && <button className="btn btn-danger" onClick={() => { if (confirm("Radera jobbet?")) { deleteJob(job.id); close(); } }}><Trash2 size={15} /> Radera</button>}
        <div className="grow" />
        <button className="btn btn-ghost" onClick={close}>Avbryt</button>
        <button className="btn btn-primary" onClick={save}>Spara</button>
      </div>
    </Modal>
  );
}

function FinishModal({ ctx, job, close }) {
  const { finishJob, custById } = ctx;
  const c = custById[job.customerId];
  const [pm, setPm] = useState(job.paymentMethod || "Swish");
  const [send, setSend] = useState(true);
  return (
    <Modal title="Avsluta jobb" close={close}>
      <p className="muted">Markera <strong>{c?.name}</strong> som klart och betalt. Kvittot genereras direkt.</p>
      <Field label="Betalsätt (på plats)">
        <div className="segm full">{PAYMENTS.map((p) => <button key={p} className={pm === p ? "seg-on" : ""} onClick={() => setPm(p)}>{p}</button>)}</div>
      </Field>
      <label className="check"><input type="checkbox" checked={send} onChange={(e) => setSend(e.target.checked)} />
        Skicka kvitto automatiskt {c?.email ? `till ${c.email}` : "(kund saknar e-post)"}</label>
      <div className="modal-foot"><div className="grow" />
        <button className="btn btn-ghost" onClick={close}>Avbryt</button>
        <button className="btn btn-primary" onClick={() => { finishJob(job, pm, send && !!c?.email); close(); }}><Check size={15} /> Klar &amp; skicka kvitto</button>
      </div>
    </Modal>
  );
}

function ReceiptModal({ ctx, job, close }) {
  const { settings, custById, rutOf, customerPays, upsertJob, flash } = ctx;
  const c = custById[job.customerId];
  const momsbas = job.price / 1.25;
  const moms = job.price - momsbas;
  const num = "K-" + job.id.slice(-6).toUpperCase();
  const mailto = () => {
    const body = `Tack för ditt köp hos ${settings.company}!\n\nKvitto ${num}\nDatum: ${dfmt(job.receiptSentAt || todayISO())}\nTjänst: Fönsterputsning\nPris: ${kr(job.price)} (varav moms ${kr(moms)})\nRUT-avdrag: -${kr(rutOf(job))}\nAtt betala: ${kr(customerPays(job))}\nBetalsätt: ${job.paymentMethod}\n\n${settings.company} · ${settings.orgnr} · ${settings.phone}`;
    window.location.href = `mailto:${c?.email || ""}?subject=${encodeURIComponent("Kvitto " + num + " – " + settings.company)}&body=${encodeURIComponent(body)}`;
  };
  return (
    <Modal title="Kvitto" close={close}>
      <div className="receipt">
        <div className="rc-head">
          <div><div className="rc-co">{settings.company}</div><div className="muted small">{settings.address} · Org.nr {settings.orgnr}</div></div>
          <div className="rc-drop"><Droplets size={20} /></div>
        </div>
        <div className="rc-meta"><span>Kvitto {num}</span><span>{dfmt(job.receiptSentAt || todayISO())}</span></div>
        <div className="rc-cust">{c?.name}<br /><span className="muted small">{c?.address}, {c?.ort}</span></div>
        <div className="rc-lines">
          <div><span>Fönsterputsning</span><span>{kr(job.price)}</span></div>
          <div className="muted"><span>varav moms 25 %</span><span>{kr(moms)}</span></div>
          <div><span>RUT-avdrag (50 %)</span><span>−{kr(rutOf(job))}</span></div>
          <div className="rc-total"><span>Att betala</span><span>{kr(customerPays(job))}</span></div>
          <div className="muted"><span>Betalsätt</span><span>{job.paymentMethod || "—"}</span></div>
        </div>
        <div className="rc-foot">Tack för att du valde {settings.company}! 💧</div>
      </div>
      <p className="muted small center">Kvittots utseende ändrar du i Inställningar (företagsuppgifter). Designen kan du sedan göra helt egen.</p>
      <div className="modal-foot"><div className="grow" />
        <button className="btn btn-ghost" onClick={() => { upsertJob({ ...job, receiptSent: true, receiptSentAt: todayISO() }); flash("Markerat som skickat"); }}>Markera skickat</button>
        <button className="btn btn-primary" onClick={mailto}><Send size={15} /> Öppna e-post</button>
      </div>
    </Modal>
  );
}

function CustomerModal({ ctx, c, close }) {
  const { cust, saveCust, flash } = ctx;
  const [f, setF] = useState(c || { id: uid(), name: "", personnummer: "", phone: "", email: "", address: "", ort: "", recurringMonths: 0, notes: "", createdAt: todayISO() });
  const ch = (k, v) => setF({ ...f, [k]: v });
  const save = () => {
    if (!f.name) return flash("Ange namn.");
    saveCust(cust.some((x) => x.id === f.id) ? cust.map((x) => (x.id === f.id ? f : x)) : [f, ...cust]);
    flash(c ? "Kund uppdaterad" : "Kund tillagd"); close();
  };
  return (
    <Modal title={c ? "Redigera kund" : "Ny kund"} close={close}>
      <div className="form-grid">
        <Field label="Namn" full><input value={f.name} onChange={(e) => ch("name", e.target.value)} /></Field>
        <Field label="Telefon"><input value={f.phone} onChange={(e) => ch("phone", e.target.value)} /></Field>
        <Field label="E-post (för kvitto)"><input value={f.email} onChange={(e) => ch("email", e.target.value)} /></Field>
        <Field label="Personnummer (för RUT)"><input value={f.personnummer} onChange={(e) => ch("personnummer", e.target.value)} placeholder="ÅÅÅÅMMDD-XXXX" /></Field>
        <Field label="Återkommande (mån, 0 = engång)"><input type="number" value={f.recurringMonths} onChange={(e) => ch("recurringMonths", +e.target.value)} /></Field>
        <Field label="Adress"><input value={f.address} onChange={(e) => ch("address", e.target.value)} /></Field>
        <Field label="Ort"><input value={f.ort} onChange={(e) => ch("ort", e.target.value)} /></Field>
        <Field label="Anteckning" full><textarea rows={2} value={f.notes} onChange={(e) => ch("notes", e.target.value)} /></Field>
      </div>
      <div className="modal-foot"><div className="grow" /><button className="btn btn-ghost" onClick={close}>Avbryt</button><button className="btn btn-primary" onClick={save}>Spara</button></div>
    </Modal>
  );
}

function EmployeeModal({ ctx, e, close }) {
  const { emp, saveEmp, flash, currentUser } = ctx;
  const [f, setF] = useState(e || { id: uid(), name: "", role: "Säljare", phone: "", provisionRate: 20, tvattRate: 0, pin: "1234", isAdmin: false, active: true });
  const ch = (k, v) => setF({ ...f, [k]: v });
  const save = () => {
    if (!f.name) return flash("Ange namn.");
    saveEmp(emp.some((x) => x.id === f.id) ? emp.map((x) => (x.id === f.id ? f : x)) : [...emp, f]);
    flash(e ? "Uppdaterad" : "Tillagd"); close();
  };
  return (
    <Modal title={e ? "Redigera anställd" : "Ny anställd"} close={close}>
      <div className="form-grid">
        <Field label="Namn" full><input value={f.name} onChange={(ev) => ch("name", ev.target.value)} /></Field>
        <Field label="Roll"><select value={f.role} onChange={(ev) => ch("role", ev.target.value)}><option>Säljare</option><option>Tvättare</option><option>Båda</option></select></Field>
        <Field label="Telefon"><input value={f.phone} onChange={(ev) => ch("phone", ev.target.value)} /></Field>
        <Field label="Säljprovision (% av jobbvärde)"><input type="number" value={f.provisionRate} onChange={(ev) => ch("provisionRate", +ev.target.value)} /></Field>
        <Field label="Tvättersättning (% av jobbvärde)"><input type="number" value={f.tvattRate} onChange={(ev) => ch("tvattRate", +ev.target.value)} /></Field>
        <Field label="Inloggnings-PIN"><input value={f.pin} onChange={(ev) => ch("pin", ev.target.value)} /></Field>
        <Field label="Behörighet">
          <label className="check" style={{ marginTop: 0 }}><input type="checkbox" checked={!!f.isAdmin} onChange={(ev) => ch("isAdmin", ev.target.checked)} /> Admin (ser hela företaget)</label>
        </Field>
      </div>
      <p className="muted small" style={{ marginTop: 10 }}>Tips: Gustav är putsare men har provision &gt; 0 % – då dyker han upp som möjlig säljare på jobb och får en egen provisionssida för merförsäljning.</p>
      <div className="modal-foot">
        {e && e.id !== currentUser?.id && <button className="btn btn-danger" onClick={() => { if (confirm("Ta bort anställd?")) { saveEmp(emp.filter((x) => x.id !== e.id)); close(); } }}><Trash2 size={15} /> Ta bort</button>}
        <div className="grow" /><button className="btn btn-ghost" onClick={close}>Avbryt</button><button className="btn btn-primary" onClick={save}>Spara</button>
      </div>
    </Modal>
  );
}

/* ------------------------------------------------------------------ */
/*  Småkomponenter                                                     */
/* ------------------------------------------------------------------ */
function SectionTitle({ title, sub }) { return <div className="sec-title"><h1>{title}</h1><p>{sub}</p></div>; }
function Field({ label, children, full }) { return <label className={"field" + (full ? " full" : "")}><span>{label}</span>{children}</label>; }
function Empty({ text }) { return <div className="empty">{text}</div>; }

const st = { wrap: { minHeight: "100%" } };

/* ================================================================== */
/*  CSS                                                                */
/* ================================================================== */
const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap');
:root{
  --ink:#0a2826; --ink2:#13403b; --aqua:#0fb5a6; --aqua-d:#0a8d82; --mint:#e8f7f4;
  --sun:#e8920c; --violet:#7c6cf0; --paper:#eef4f3; --card:#ffffff; --line:#dbe8e5;
  --muted:#6b8480; --danger:#d6452f;
}
*{box-sizing:border-box}
div, h1,h2,h3,p,span,button,input,select,textarea,label,li,ul{font-family:'Hanken Grotesk',system-ui,sans-serif}
h1,h2,h3,.brand-name,.kpi-val,.rc-co{font-family:'Bricolage Grotesque',sans-serif}
body{margin:0}
.loading{display:flex;gap:10px;align-items:center;justify-content:center;height:60vh;color:var(--aqua-d);font-weight:600}

/* shell */
.topbar,.nav,.main{}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;background:linear-gradient(120deg,var(--ink) 0%,var(--ink2) 100%);color:#eafffb}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(140deg,var(--aqua),#34e0cf);display:flex;align-items:center;justify-content:center;color:#063;box-shadow:0 6px 18px rgba(15,181,166,.45)}
.brand-name{font-size:22px;font-weight:800;letter-spacing:.14em;line-height:1}
.brand-sub{font-size:11.5px;color:#8fcfc6;margin-top:3px}
.nav{display:flex;gap:4px;padding:8px 14px;background:var(--ink2);overflow-x:auto;position:sticky;top:0;z-index:5}
.nav button{display:flex;align-items:center;gap:7px;white-space:nowrap;border:0;background:transparent;color:#a7d3cc;padding:9px 14px;border-radius:10px;font-weight:600;font-size:13.5px;cursor:pointer;transition:.15s}
.nav button:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav .nav-on{background:var(--aqua);color:#04302c}
.main{padding:22px;background:var(--paper);min-height:calc(100vh - 116px)}
.stack{display:flex;flex-direction:column;gap:18px;max-width:1100px;margin:0 auto}

.sec-title h1{margin:0;font-size:25px;color:var(--ink)}
.sec-title p{margin:4px 0 0;color:var(--muted);font-size:13.5px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(10,40,38,.04)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-head h3{margin:0;font-size:16px;color:var(--ink)}
.cnt,.card-head em{font-style:normal;color:var(--muted);font-weight:600}

/* kpi */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{position:relative;overflow:hidden}
.kpi-label{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi-val{font-size:27px;font-weight:800;margin-top:6px;color:var(--ink)}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
.kpi-ink:before{background:var(--ink)} .kpi-aqua:before{background:var(--aqua)}
.kpi-sun:before{background:var(--sun)} .kpi-violet:before{background:var(--violet)}
.kpi-val.sun{color:var(--sun)}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* lists */
.mini-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mini-list li{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line)}
.mini-list li:last-child{border:0}
.ml-name{font-weight:700;color:var(--ink);font-size:14px}
.ml-sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:2px}
.ring{display:inline-flex;align-items:center;gap:5px;color:var(--aqua-d);text-decoration:none;font-weight:700;font-size:12.5px;background:var(--mint);padding:6px 10px;border-radius:9px}
.ring.sm{padding:6px;border-radius:8px}
.ring.inline{background:transparent;padding:0}
.link{border:0;background:none;color:var(--aqua-d);font-weight:700;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:2px}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:flex;align-items:center;gap:8px;background:var(--mint);border:1px solid #cdeae5;padding:8px 12px;border-radius:12px;font-size:13px;color:var(--ink2)}
.chip strong{color:var(--ink)} .chip span{color:var(--muted);font-size:12px}
.chip-late{background:#fdece9;border-color:#f6c9bf}

/* toolbar / segmented */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.segm{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;gap:2px}
.segm.full{display:flex;width:100%}.segm.full button{flex:1}
.segm button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.segm button em{font-style:normal;opacity:.7;margin-left:2px}
.segm .seg-on{background:var(--ink);color:#fff}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:11px;padding:10px 16px;font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s;font-family:'Hanken Grotesk',sans-serif}
.btn-primary{background:var(--aqua);color:#03332f}
.btn-primary:hover{background:var(--aqua-d);color:#fff}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink2)}
.btn-ghost:hover{border-color:var(--aqua)}
.btn-danger{background:#fdeee9;color:var(--danger);border:1px solid #f4d2c8}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{color:var(--ink);border-color:var(--aqua)}

/* job cards */
.job-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.job-card,.cust-card{display:flex;flex-direction:column;gap:12px}
.job-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.job-cust{font-weight:800;color:var(--ink);font-size:16px}
.job-addr,.muted{color:var(--muted);font-size:12.5px}
.muted.small{font-size:11.5px}
.job-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2)}
.job-meta span{display:inline-flex;align-items:center;gap:4px}
.job-money{display:flex;gap:14px;background:var(--mint);border-radius:12px;padding:10px 12px}
.job-money>div{display:flex;flex-direction:column}
.job-money span{font-size:11px;color:var(--muted)}
.job-money strong{font-size:15px;color:var(--ink2)}
.job-money .hl strong{color:var(--aqua-d)}
.job-foot{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:#eef2f1;color:var(--muted)}
.tag-ok{background:#e2f6ec;color:#1c8f56}
.tag-warn{background:#fdf0d9;color:#b07407}
.tag-rut-Ejansökt{background:#fdf0d9;color:#b07407}
.tag-rut-Ansökt{background:#e6eefb;color:#3f5fc4}
.tag-rut-Utbetald{background:#e2f6ec;color:#1c8f56}
.job-actions{display:flex;align-items:center;gap:7px}
.job-actions .btn{margin-left:auto}

.badge{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:20px}
.st-Såld{background:#eef2f1;color:#5b736f}
.st-Bokad{background:#e6eefb;color:#3f5fc4}
.st-Klar{background:#e2f6ec;color:#1c8f56}
.rec-pill{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--aqua-d);background:var(--mint);padding:2px 8px;border-radius:20px;margin-left:8px;vertical-align:2px}

.cust-rows{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink2)}
.note{background:#fbf7ea;border-radius:8px;padding:6px 9px;font-size:12px;color:#7a6b3e}
.cust-stats{display:flex;flex-wrap:wrap;gap:10px 18px;border-top:1px solid var(--line);padding-top:12px}
.cust-stats>div{display:flex;flex-direction:column}
.cust-stats span{font-size:11px;color:var(--muted)} .cust-stats strong{color:var(--ink);font-size:15px}
.cust-stats .danger strong{color:var(--danger)}
.cap-warn{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--danger);background:#fdeee9;border-radius:8px;padding:6px 9px}
.rate-row{display:flex;gap:7px;flex-wrap:wrap}

/* info / rut */
.info-card{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.rut-table{display:flex;flex-direction:column}
.rut-head,.rut-row{display:grid;grid-template-columns:1.4fr 1.2fr 1fr 1fr auto;gap:10px;align-items:center}
.rut-head{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:0 0 8px}
.rut-row{padding:11px 0;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink2)}
.mono{font-variant-numeric:tabular-nums;font-size:13px}
.rut-actions{display:flex;align-items:center;gap:6px;justify-content:flex-end}

/* forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field>span{font-size:12px;font-weight:600;color:var(--ink2)}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px;color:var(--ink);background:#fff;width:100%}
input:focus,select,textarea:focus{outline:none;border-color:var(--aqua)}
textarea{resize:vertical}
.row-gap{display:flex;gap:8px} .row-gap select{flex:1}
.row-end{display:flex;justify-content:flex-end;margin-top:14px}
.form-card .form-grid{margin-bottom:0}
.check{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink2);margin-top:6px;cursor:pointer}
.check input{width:auto}

.calc-strip{display:flex;gap:24px;background:var(--mint);border-radius:12px;padding:12px 16px;margin-top:14px}
.calc-strip div{display:flex;flex-direction:column}
.calc-strip span{font-size:11px;color:var(--muted)} .calc-strip strong{font-size:17px;color:var(--ink2)}
.calc-strip .hl strong{color:var(--aqua-d)}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(8,28,26,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:20px;width:100%;max-width:560px;margin:auto;box-shadow:0 24px 60px rgba(8,28,26,.35)}
.modal-wide{max-width:760px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0;font-size:19px;color:var(--ink)}
.modal-body{padding:20px}
.modal-foot{display:flex;align-items:center;gap:9px;margin-top:18px}
.grow{flex:1}

/* receipt */
.receipt{border:1px solid var(--line);border-radius:16px;padding:22px;background:linear-gradient(180deg,#fff,#fafdfc)}
.rc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rc-co{font-size:20px;font-weight:800;color:var(--ink)}
.rc-drop{width:42px;height:42px;border-radius:12px;background:var(--mint);color:var(--aqua-d);display:flex;align-items:center;justify-content:center}
.rc-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin:14px 0;padding:8px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.rc-cust{font-weight:700;color:var(--ink);font-size:14px;margin-bottom:12px}
.rc-lines{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink2)}
.rc-lines>div{display:flex;justify-content:space-between}
.rc-lines .muted{font-size:12px}
.rc-total{font-weight:800;color:var(--ink);font-size:17px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.rc-foot{text-align:center;color:var(--aqua-d);font-weight:700;margin-top:18px;font-size:13px}
.center{text-align:center}

.empty{text-align:center;color:var(--muted);font-size:13px;padding:22px}
.danger-card{border-color:#f0d4cc}
.danger{color:var(--danger)}

/* toast / warn */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#eafffb;padding:12px 18px;border-radius:12px;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(8,28,26,.4);z-index:60}
.warnbar{position:fixed;bottom:0;left:0;right:0;background:#b07407;color:#fff;font-size:12px;padding:6px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;z-index:40}

@media(max-width:820px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .two-col{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .rut-head{display:none}
  .rut-row{grid-template-columns:1fr 1fr;gap:4px 10px}
  .rut-row span[data-l]:before{content:attr(data-l) ": ";color:var(--muted);font-size:11px}
  .rut-actions{grid-column:1/-1;justify-content:flex-start;margin-top:6px}
  .main{padding:16px}
  .top-right .btn-primary span,.uc-role{display:none}
  .people-grid{grid-template-columns:repeat(2,1fr)}
}

/* topbar right */
.top-right{display:flex;align-items:center;gap:12px}
.user-chip{display:flex;align-items:center;gap:9px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,var(--aqua),#34e0cf);color:#04302c;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.avatar.lg{width:48px;height:48px;font-size:20px}
.avatar.xl{width:64px;height:64px;font-size:26px;margin:0 auto}
.uc-name{font-size:13.5px;font-weight:700;color:#eafffb;line-height:1.1}
.uc-role{font-size:11px;color:#8fcfc6}
.logout{background:rgba(255,255,255,.08);border-color:transparent;color:#cdeee8}
.logout:hover{background:var(--danger);color:#fff;border-color:transparent}

/* login */
.login-wrap{min-height:100vh;background:linear-gradient(150deg,var(--ink) 0%,var(--ink2) 60%,#0a5048 100%);display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:#fff;border-radius:24px;padding:34px;width:100%;max-width:460px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.login-logo{width:56px;height:56px;border-radius:17px;background:linear-gradient(140deg,var(--aqua),#34e0cf);color:#04302c;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 8px 22px rgba(15,181,166,.45)}
.login-q{font-weight:700;color:var(--ink);margin:22px 0 14px;font-size:15px}
.people-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.person-card{display:flex;flex-direction:column;align-items:center;gap:7px;padding:16px 8px;border:1px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;transition:.15s}
.person-card:hover{border-color:var(--aqua);transform:translateY(-2px);box-shadow:0 8px 18px rgba(15,181,166,.18)}
.person-name{font-weight:700;color:var(--ink);font-size:13.5px}
.role-tag{font-size:10.5px;color:var(--muted);background:#eef2f1;padding:2px 8px;border-radius:20px}
.pin-pane{display:flex;flex-direction:column;gap:12px;align-items:center}
.pin-input{max-width:180px;text-align:center;font-size:26px;letter-spacing:.4em;padding:12px}
.pin-input.shake{animation:shake .35s;border-color:var(--danger)}
.pin-err{color:var(--danger);font-size:12.5px;font-weight:600}
.pin-row{display:flex;gap:10px;margin-top:4px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* portal nav */
.pnav{display:flex;gap:6px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px}
.pnav button{display:flex;align-items:center;gap:7px;border:0;background:none;color:var(--muted);padding:10px 16px;border-radius:10px;font-weight:700;font-size:13.5px;cursor:pointer}
.pnav .pn-on{background:var(--ink);color:#fff}
.job-addr.big{font-size:14.5px;color:var(--ink2);font-weight:600;margin-top:3px}
.collect{display:flex;align-items:center;justify-content:space-between;background:var(--mint);border-radius:12px;padding:11px 14px;margin-top:auto}
.collect span{font-size:11.5px;color:var(--muted)} .collect strong{font-size:16px;color:var(--aqua-d)}
.job-card.faded{opacity:.62}
.tag-admin{background:#efe8ff;color:#6a55e0}
.barchart{display:flex;align-items:flex-end;gap:14px;height:210px;padding:8px 4px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bar-track{width:100%;max-width:54px;flex:1;display:flex;align-items:flex-end}
.bar-fill{width:100%;border-radius:8px 8px 0 0;min-height:4px;transition:height .4s}
.bar-x{font-size:12px;color:#476;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bar-v{font-size:11px;color:var(--muted)}

`;


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(GlansCRM));

</script>
</body>
</html>
